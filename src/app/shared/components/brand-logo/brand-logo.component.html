<div class="eib-logo-wrapper" [class.eib-logo-dark]="theme === 'dark'" [class.size-sm]="size === 'sm'"
  [class.size-md]="size === 'md'" [class.size-lg]="size === 'lg'">
  <!-- Light Mode Official Logo -->
  <img src="/elite-logo-clean.png" alt="Elite Integrated Business" class="eib-brand-logo-img logo-light" />
  <!-- Dark Mode Official Logo -->
  <img src="/elite-logo-dark.png" alt="Elite Integrated Business" class="eib-brand-logo-img logo-dark" />
</div>
